# MySQL 配置
[mysql]
host = localhost
port = 3306
user = root
password = 123456
database = df_rag

# mongodb 配置
[mongodb]
mongo_url = mongodb://localhost:27017/
user = admin
mongo_db_name = subjects_kg
mongo_collection_name = jpkb

# Redis 配置
[redis]
host = localhost
port = 6379
password =
db = 0

# Redis 向量缓存配置
[redis_vector_cache]
index_name = rag_query_vector_cache
vector_dim = 768
similarity_threshold = 0.95  # 相似度阈值，>=这个值就算命中
temporary_ttl = 86400       # 临时缓存过期时间：24小时（秒）
formal_ttl = 604800         # 正式缓存过期时间：7天（秒）
hot_threshold = 3           # 命中多少次升级为正式缓存
max_cache_size = 100000      # 最大缓存条数，超过了LRU自动淘汰

# Milvus 配置
[milvus]
host = 127.0.0.1
port = 19530
database_name = df_finance_rag
collection_name = df_announce_chunks

# LLM 配置
[llm]
model = qwen3.7-plus
dashscope_api_key = sk-ec753911d5cc4f53affc0233fc93026c
dashscope_base_url = https://dashscope.aliyuncs.com/compatible-mode/v1

# 检索参数配置
[retrieval]
parent_chunk_size = 500
child_chunk_size = 50
chunk_overlap = 5
retrieval_k = 3
candidate_m = 2

# 日志配置
[logger]
log_file = F:\small_project\aiagent\ailearn\rag\app.log

# 应用配置
[app]
valid_sources = ["ai", "java", "test", "ops", "bigdata"]
customer_service_phone = 12345678